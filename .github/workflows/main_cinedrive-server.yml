# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - cinedrive-server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install FFmpeg and bundle Linux binary
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          cp /usr/bin/ffmpeg server/ffmpeg
          chmod +x server/ffmpeg

      - name: npm install and zip server directory
        run: |
          cd server
          npm install --production
          zip -r ../server.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: server.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'cinedrive-server'
          slot-name: 'Production'
          package: server.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_87B8D7D21D044C42BC865994609A87F7 }}